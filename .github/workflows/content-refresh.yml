# The site is static: Hasura/CMS changes reach it through a rebuild.
# Nightly (and on demand) this triggers a Cloudflare Pages build and refreshes the Algolia index.
name: Content refresh

on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC daily
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rebuild Algolia index
        run: pnpm index:algolia
        env:
          HASURA_URL: ${{ secrets.HASURA_URL }}
          HASURA_ADMIN_SECRET: ${{ secrets.HASURA_ADMIN_SECRET }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          PUBLIC_ALGOLIA_APP_ID: ${{ vars.PUBLIC_ALGOLIA_APP_ID }}
          PUBLIC_ALGOLIA_INDEX_NAME_COMMON: ${{ vars.PUBLIC_ALGOLIA_INDEX_NAME_COMMON }}
      - name: Trigger Cloudflare Pages build
        # Pushes to main already build via the Pages Git integration.
        if: github.event_name != 'push'
        run: curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
