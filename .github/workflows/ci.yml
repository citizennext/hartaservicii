name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HASURA_URL: ${{ secrets.HASURA_URL }}
  HASURA_ADMIN_SECRET: ${{ secrets.HASURA_ADMIN_SECRET }}
  PUBLIC_ALGOLIA_APP_ID: ${{ vars.PUBLIC_ALGOLIA_APP_ID }}
  PUBLIC_ALGOLIA_SEARCH_KEY: ${{ vars.PUBLIC_ALGOLIA_SEARCH_KEY }}
  PUBLIC_ALGOLIA_INDEX_NAME_COMMON: ${{ vars.PUBLIC_ALGOLIA_INDEX_NAME_COMMON }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and run e2e tests
        run: pnpm test:e2e
        env:
          CI: true
      - name: Ensure the Hasura admin secret is not in the build output
        run: |
          if grep -rqF "$HASURA_ADMIN_SECRET" dist; then
            echo "::error::HASURA_ADMIN_SECRET found in dist/"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
